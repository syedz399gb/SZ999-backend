version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: wallet_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: seamless_wallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wallet_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: wallet_backend
    restart: always
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: seamless_wallet
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PROVIDER_SECRET: super_secret_casino_key_123
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: wallet_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  pgdata: